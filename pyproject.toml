[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-fm"
version = "0.1.0"
description = "Give your AI agent a voice — an MCP server for text-to-speech"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Harsh" }]
keywords = ["mcp", "tts", "agent", "voice", "text-to-speech", "claude", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "mcp>=1.0.0",
    "kokoro-onnx>=0.4.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
]

[project.scripts]
agent-fm = "agent_fm:main"

[project.urls]
Homepage = "https://github.com/anthropics/agent-fm"
Repository = "https://github.com/anthropics/agent-fm"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_fm"]

[tool.hatch.build.targets.sdist]
include = ["src/agent_fm", "AGENTS.md", "hooks"]
